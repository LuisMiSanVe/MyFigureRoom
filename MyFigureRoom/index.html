<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MyFigureRoom</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="room">
      <div id="stage" class="right">
        <div class="slide" id="s1" style="transform-origin: 76% 47%">
          <svg
            viewBox="0 0 1600 900"
            preserveAspectRatio="none"
            role="img"
            aria-label="Bedroom with bed and desk"
          >
            <defs>
              <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fde3cf" />
                <stop offset="1" stop-color="#f9cfdc" />
              </linearGradient>
              <radialGradient id="g" cx=".5" cy=".4" r=".6">
                <stop offset="0" stop-color="#fff" stop-opacity=".8" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="sc" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#86c3f2" />
                <stop offset=".55" stop-color="#bb9cf0" />
                <stop offset="1" stop-color="#f59db8" />
              </linearGradient>
            </defs>
            <rect width="1600" height="900" fill="url(#w)" />
            <rect class="fl" y="650" width="1600" height="250" />
            <path class="pl" d="M0 720h1600M0 790h1600M0 860h1600" fill="none" />
            <rect class="bs" y="636" width="1600" height="18" />
            <ellipse cx="870" cy="330" rx="520" ry="360" fill="url(#g)" />
            <path
              d="M-20 90Q400 190 800 100T1620 100"
              class="yl"
              stroke="#ffd36b"
              stroke-width="12"
              stroke-linecap="round"
              stroke-dasharray="0 52"
              fill="none"
            />
            <g>
              <rect class="bs" x="750" y="150" width="260" height="290" rx="130 130 14 14" />
              <rect class="sk" x="766" y="166" width="228" height="258" rx="116 116 8 8" />
              <circle class="yl" cx="900" cy="250" r="26" />
              <ellipse class="bs" cx="830" cy="320" rx="50" ry="16" />
              <path class="gr2" d="M880 300q40-14 90 6v100H766V360q60-50 114-60z" />
              <path d="M880 166v258M766 296h228" stroke="#fff" stroke-width="8" />
              <path
                class="pk"
                d="M700 130q40 120 14 330h60V130zM1060 130q-40 120-14 330h-60V130z"
              />
              <rect class="wd2" x="690" y="120" width="380" height="12" rx="6" />
            </g>
            <rect class="bs" x="190" y="150" width="120" height="160" rx="8" />
            <rect class="lv2" x="204" y="164" width="92" height="132" />
            <circle class="pk" cx="250" cy="215" r="26" />
            <path class="mn" d="M204 296l40-50 52 50z" />
            <rect class="bs" x="340" y="190" width="90" height="90" rx="8" />
            <rect class="yl" x="352" y="202" width="66" height="66" />
            <path class="pk" d="M352 268l33-36 33 36z" />
            <ellipse class="mn" cx="800" cy="810" rx="330" ry="52" />
            <ellipse class="mn2" cx="800" cy="810" rx="250" ry="34" />
            <g>
              <path
                class="gr"
                d="M780 640c-70-60-60-150-30-200 20 70 40 120 30 200zM800 640c0-90 30-160 70-200 10 80-10 150-70 200zM820 640c50-40 120-50 150-110-90 0-140 50-150 110z"
              />
              <path class="bs" d="M752 600h96l-14 70h-68z" />
            </g>
            <g class="hot" id="bed" tabindex="0" role="button" aria-label="Open wishlist">
              <ellipse cx="390" cy="725" rx="330" ry="22" fill="#4f406828" />
              <rect class="wd" x="70" y="360" width="70" height="360" rx="30" />
              <rect class="wd" x="100" y="520" width="590" height="190" rx="22" />
              <rect class="bs" x="120" y="470" width="560" height="120" rx="40" />
              <path class="lv" d="M300 500h380v110a24 24 0 0 1-24 24H324a24 24 0 0 1-24-24z" />
              <path class="lv2" d="M300 500h380v34H300z" />
              <rect class="bs" x="130" y="430" width="170" height="74" rx="34" />
              <rect class="pk" x="170" y="450" width="140" height="66" rx="30" />
              <circle fill="#f5b48c" cx="560" cy="480" r="32" />
              <circle fill="#f5b48c" cx="540" cy="456" r="11" />
              <circle fill="#f5b48c" cx="580" cy="456" r="11" />
              <circle fill="#4f4068" cx="550" cy="476" r="3" />
              <circle fill="#4f4068" cx="570" cy="476" r="3" />
              <rect class="wd2" x="670" y="560" width="26" height="160" rx="10" />
              <rect class="wd2" x="100" y="700" width="20" height="40" />
              <rect class="wd2" x="660" y="700" width="20" height="40" />
              <text class="lab" x="270" y="780">Wishlist</text>
            </g>
            <rect class="wd" x="990" y="565" width="540" height="26" rx="10" />
            <rect class="wd2" x="1010" y="591" width="26" height="195" />
            <rect class="wd2" x="1484" y="591" width="26" height="195" />
            <rect class="wd" x="1300" y="591" width="170" height="120" rx="10" />
            <rect class="lv" x="1330" y="640" width="110" height="10" rx="5" />
            <g>
              <path
                d="M1020 565c0-70 20-110 60-130"
                stroke="#e2ae78"
                stroke-width="10"
                fill="none"
                stroke-linecap="round"
              />
              <path class="yl" d="M1060 430l60-20 8 28-56 18z" />
              <ellipse class="wd2" cx="1030" cy="565" rx="34" ry="8" />
            </g>
            <rect class="pk" x="1360" y="520" width="44" height="46" rx="10" />
            <path d="M1404 532a14 14 0 0 1 0 22" stroke="#f58fb0" stroke-width="6" fill="none" />
            <rect class="bs" x="1440" y="505" width="40" height="60" rx="6" />
            <path
              class="gr"
              d="M1460 505c-20-30-30-40-20-60 14 18 22 36 20 60zM1460 505c10-30 30-40 40-50-2 24-14 40-40 50z"
            />
            <g class="hot" id="pc" tabindex="0" role="button" aria-label="Use the computer">
              <rect class="lv2" x="1096" y="330" width="324" height="204" rx="18" />
              <rect x="1114" y="344" width="292" height="172" rx="8" fill="url(#sc)" />
              <rect class="bs" x="1126" y="356" width="40" height="40" rx="10" opacity=".8" />
              <rect class="yl" x="1176" y="356" width="40" height="40" rx="10" />
              <rect class="mn" x="1126" y="410" width="40" height="40" rx="10" />
              <rect class="lv" x="1240" y="534" width="36" height="28" />
              <rect class="lv" x="1190" y="556" width="140" height="10" rx="5" />
              <rect class="pk2" x="1130" y="568" width="190" height="14" rx="6" />
              <text class="lab" x="1190" y="312">Computer</text>
            </g>
            <ellipse cx="1260" cy="745" rx="82" ry="16" fill="#4f406828" />
            <rect class="pk" x="1190" y="660" width="140" height="70" rx="34" />
          </svg>
        </div>
        <div class="slide" id="s2">
          <div id="world">
            <svg
              id="ssvg"
              preserveAspectRatio="none"
              role="img"
              aria-label="Display shelf"
              style="position: absolute; left: 0; width: 100%"
            ></svg>
            <div id="figs" style="position: absolute; inset: 0"></div>
          </div>
        </div>
      </div>
      <button class="arrow l" id="L" aria-label="Go to bedroom">
        <svg viewBox="0 0 64 110"><path d="M46 12L16 55l30 43" /></svg>
      </button>
      <button class="arrow r" id="R" aria-label="Go to shelf">
        <svg viewBox="0 0 64 110"><path d="M18 12l30 43-30 43" /></svg>
      </button>
      <button
        class="arrow u"
        id="U"
        aria-label="Scroll up or add a shelf"
        title="Up. Add a shelf when you reach the top"
      >
        <svg viewBox="0 0 110 64">
          <path d="M32 30L55 8l23 22" />
          <g class="pls"><path d="M55 40v18M46 49h18" /></g>
        </svg>
      </button>
      <button class="arrow d" id="D" aria-label="Scroll down">
        <svg viewBox="0 0 110 64"><path d="M32 20L55 42l23-22" /></svg>
      </button>
      <div
        id="box"
        role="button"
        tabindex="0"
        title="Click to browse the box, or hold and drag to pull out a random figure"
        aria-label="My Figures box. Click to browse, or hold and drag to pull out a random figure."
      >
        <svg viewBox="0 0 180 142" aria-hidden="true">
          <ellipse cx="90" cy="134" rx="68" ry="8" fill="#4f406828" />
          <path d="M24 60h132l-10 66H34z" fill="#c58f55" />
          <path d="M24 60h132l-4 12H28z" fill="#b17a45" />
          <path d="M24 60 42 36h96l18 24z" fill="#7d5028" />
          <path d="M24 60 4 42l38-8 7 12z" fill="#e2b47c" />
          <path d="M156 60 176 42l-38-8-7 12z" fill="#e2b47c" />
          <path d="M42 36 60 24h60l18 12-18 6H60z" fill="#efc997" />
          <path d="M38 126h104" stroke="#a97543" stroke-width="3" stroke-linecap="round" />
          <path d="M24 60h132" stroke="#a97543" stroke-width="2.5" />
        </svg>
        <span class="bh">drag or click</span>
        <span class="bl">My Figures</span>
        <span class="bc" id="boxCount"></span>
      </div>
      <div id="panel" role="group" aria-label="Selected figure"></div>
      <div id="boxModal" aria-hidden="true"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="os">
        <div class="in">
          <div id="bar">
            <span>MyFigureRoom OS</span>
            <span id="clk"></span>
            <button id="off">Shut down</button>
          </div>
          <div id="icons">
            <button class="ic" data-a="trk">
              <i style="background: #ffd36b">📦</i>
              Tracking
            </button>
            <button class="ic" data-a="mfc">
              <i style="background: #7cc4f2">🔗</i>
              MFC profile
            </button>
            <button class="ic" data-a="bak">
              <i style="background: #f58fb0">💾</i>
              Backup
            </button>
          </div>
          <div id="win"></div>
          <div id="dock">
            <button class="ic" data-a="trk" aria-label="Tracking">
              <i style="background: #ffd36b">📦</i>
            </button>
            <button class="ic" data-a="mfc" aria-label="MFC profile">
              <i style="background: #7cc4f2">🔗</i>
            </button>
            <button class="ic" data-a="bak" aria-label="Backup">
              <i style="background: #f58fb0">💾</i>
            </button>
          </div>
        </div>
      </div>
      <div id="wish" role="region" aria-label="Wishlist shelf">
        <div class="wc" style="left: 2%; top: 6%; width: 16%; height: 9%"></div>
        <div class="wc" style="right: 3%; top: 12%; width: 20%; height: 11%"></div>
        <div class="wc" style="left: 6%; bottom: 8%; width: 22%; height: 11%"></div>
        <div class="wc" style="right: 8%; bottom: 6%; width: 15%; height: 8%"></div>
        <div id="wshelf"></div>
        <div id="wempty" hidden></div>
        <button class="arrow l" id="wl" aria-label="Previous page">
          <svg viewBox="0 0 64 110">
            <path d="M46 12L16 55l30 43" />
          </svg>
        </button>
        <button class="arrow r" id="wr" aria-label="Next page">
          <svg viewBox="0 0 64 110"><path d="M18 12l30 43-30 43" /></svg>
        </button>
        <button class="b p" id="wake">Wake up</button>
      </div>
      <div id="dream">
        <div class="dsky"></div>
        <svg class="bubble" viewBox="29 38 201 185" aria-hidden="true">
          <path
            class="b-small"
            d="M114.45 212.55C113.1 211.2 112 209.15 112 208C112 205.11 116.38 201 119.45 201C122.89 201 126 204.33 126 208C126 214.39 119.04 217.13 114.45 212.55Z"
          />
          <path
            class="b-mid"
            d="M123.59 199.92C120.08 195.76 120.2 191.65 123.92 187.92C128.7 183.14 135.47 184.15 138.55 190.1C141.78 196.33 137.33 203 129.95 203C126.96 203 125.64 202.36 123.59 199.92Z"
          />
          <path
            class="b-large"
            d="M132.84 179.75C127.89 175.56 126.6 169.61 129.45 164.1C132.79 157.64 142.24 155.81 147.86 160.53C154.08 165.77 154.08 174.23 147.86 179.47C143.82 182.87 136.69 183 132.84 179.75Z"
          />
          <path
            class="b-main"
            d="M110.34 159.99C108.06 159.52 104.38 158.21 102.17 157.09L98.16 155.04 93.41 157.14C78.68 163.66 57.11 148.95 57.02 132.33C57 128.49 56.73 128.07 53.67 127.05C40.83 122.82 33.5 108.12 37.45 94.53C40 85.75 46.31 79.94 56.92 76.59C61.42 75.16 66.32 73.98 67.8 73.95C69.89 73.9 71.17 72.84 73.5 69.21C76.83 64.01 82.4 60.39 88.5 59.43C91.61 58.95 93.07 58 95.07 55.15C96.48 53.14 100 50.22 102.89 48.65C112.36 43.51 124.01 44.03 136.22 50.14C139.37 51.71 142.57 53 143.33 53C144.1 53 146.4 51.67 148.44 50.05C153.24 46.23 158.65 45.47 167.64 47.35C175.75 49.05 181.41 51.67 186.35 56.01C188.23 57.65 190.44 59 191.26 59C196.54 59 207.25 66.99 209.65 72.72C210.39 74.49 211 78.78 211 82.25C211 88.26 211.15 88.66 214.11 90.41C218.8 93.17 223.47 103.74 223.44 111.5C223.39 123.97 216.34 136.5 206.56 141.48C201.19 144.22 199.73 144.5 191.06 144.5C181.84 144.5 181.33 144.62 176.67 147.85C168.98 153.19 161.77 155.32 153.5 154.69C149.65 154.39 144.87 153.46 142.89 152.62C139.41 151.14 139.14 151.18 135.89 153.64C128.47 159.24 118.63 161.68 110.34 159.99Z"
          />
        </svg>
        <div class="dwhite"></div>
      </div>
      <input type="file" id="impf" accept=".json" hidden />
      <input type="file" id="upl" accept="image/*" hidden />
    </div>
    <script src="app.js"></script>
  </body>
</html>
